<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音乐工具箱 · 管理后台</title><link rel="stylesheet" href="/admin.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">MUSIC TOOLBOX</p><h1>安全管理后台</h1></div><div id="adminIdentity"></div></header>
<section id="loginCard" class="card login"><h2>管理员登录</h2><form id="loginForm"><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button><p id="loginMessage" class="error"></p></form></section>
<div id="dashboard" hidden><nav><button class="active" data-tab="logs">登录日志</button><button data-tab="memberships">系统权限</button><button data-tab="bans">IP 封禁</button><button data-tab="audit">审计日志</button><button id="logout" class="ghost">退出</button></nav>
<section id="logs" class="card tab"><div class="toolbar"><input id="search" placeholder="搜索账号、IP 或 User-Agent"><select id="status"><option value="">全部状态</option><option value="success">成功</option><option value="failed">失败</option><option value="blocked">已拦截</option></select><button id="searchBtn">搜索</button></div><div class="table-wrap"><table><thead><tr><th>时间</th><th>类型 / 账号</th><th>IP</th><th>状态</th><th>User-Agent</th><th>操作</th></tr></thead><tbody id="logRows"></tbody></table></div><div id="pager" class="pager"></div></section>
<section id="memberships" class="card tab" hidden><div class="toolbar"><select id="membershipSystem"><option value="">两个系统</option><option value="hobby">音乐爱好者</option><option value="gaokao">高考音乐生</option></select></div><div class="table-wrap"><table><thead><tr><th>账号</th><th>系统</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="membershipRows"></tbody></table></div></section>
<section id="bans" class="card tab" hidden><form id="banForm" class="ban-form"><input name="ipAddress" placeholder="IPv4 或 IPv6" required><input name="reason" maxlength="300" placeholder="封禁原因"><select name="duration"><option value="">永久</option><option value="1">1 小时</option><option value="24">1 天</option><option value="168">7 天</option></select><button>封禁 / 更新</button></form><div class="table-wrap"><table><thead><tr><th>IP</th><th>原因</th><th>到期</th><th>管理员</th><th>操作</th></tr></thead><tbody id="banRows"></tbody></table></div></section>
<section id="audit" class="card tab" hidden><div class="table-wrap"><table><thead><tr><th>时间</th><th>管理员</th><th>操作</th><th>目标</th><th>来源 IP</th></tr></thead><tbody id="auditRows"></tbody></table></div></section></div></main><script src="/admin.js" defer></script></body></html>
